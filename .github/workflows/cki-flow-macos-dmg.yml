name: CKI Flow — macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'cki-flow-v*'

permissions:
  contents: write

jobs:
  test-web:
    name: Web tests + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cki-flow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: cki-flow/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  build-macos-dmg:
    name: Build DMG (${{ matrix.label }})
    needs: test-web
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: apple-silicon
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - label: intel
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: cki-flow/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: cki-flow/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: cki-flow
        run: npm ci

      # Unsigned local/CI DMG is fine for internal ЦКИ use.
      # To sign + notarize, uncomment APPLE_* secrets below and configure the repo.
      - name: Build macOS DMG (artifacts)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: cki-flow
          args: ${{ matrix.args }}
          uploadArtifacts: true

      - name: Build macOS DMG (draft release)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: cki-flow
          args: ${{ matrix.args }}
          uploadArtifacts: true
          tagName: ${{ github.ref_name }}
          releaseName: CKI Flow ${{ github.ref_name }}
          releaseBody: |
            Desktop build of CKI Flow for macOS.
            Download the `.dmg` matching your Mac architecture (Apple Silicon or Intel).
          releaseDraft: true
          prerelease: false
