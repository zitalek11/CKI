[package]
name = "cki-flow"
version = "0.1.0"
description = "CKI Flow — product delivery workspace"
authors = ["CKI"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "cki_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
